name: Website Preview (Astro)

# Per-PR preview of the WIP Astro/Starlight docs site (Phase D2). This is
# ADDITIVE to the live MkDocs pipeline and NEVER touches the gh-pages root:
#   * it deploys under the umbrella dir `astro-preview/` (per PR:
#     `astro-preview/pr-<N>/`), which is DISTINCT from the MkDocs preview in
#     `doc.yml` (default umbrella `pr-preview/`), so the two never collide;
#   * production cutover to `main`/root is a later phase.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Serialize with EVERY other gh-pages writer (devdoc.yml dev deploy,
# pub_doc.yml release deploy, squash-gh-pages.yml, website-deploy.yml) on one
# shared group so concurrent pushes can't clobber the branch. Must stay
# cancel-in-progress:false — cancelling a push mid-flight can corrupt gh-pages.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

permissions:
  contents: write # push the preview to the gh-pages branch
  pull-requests: write # leave/update the sticky preview comment

jobs:
  preview:
    name: Build + deploy Astro PR preview
    runs-on: ubuntu-latest
    env:
      # The preview is served at https://bloqade.quera.com/astro-preview/pr-<N>/
      # (gh-pages CNAME). Astro's `base` MUST match this subpath exactly or every
      # asset URL and internal link 404s.
      SITE_BASE: /astro-preview/pr-${{ github.event.pull_request.number }}/
      SITE_URL: https://bloqade.quera.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ---- build (skipped when the PR is merely being closed; the deploy step
      #      below still runs to TEAR DOWN the preview) ----
      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install bloqade (pins the API source tags for resolve_sources.py)
        if: github.event.action != 'closed'
        run: uv sync

      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website JS deps
        if: github.event.action != 'closed'
        run: pnpm --dir website install --frozen-lockfile

      # docs:unit — FAST, isolated component/lib unit tests (vitest + Astro
      # Container API). The THIRD docs gate, SEPARATE from the link/xref gate
      # (docs:check) and the build-warning + Playwright runtime gate (docs:test)
      # below. Needs no full build, no browser, and no generated API content, so
      # it runs right after the JS deps install and fails fast.
      - name: Docs component/lib unit tests (docs:unit)
        if: github.event.action != 'closed'
        run: pnpm --dir website test

      - name: Install pinned Rust nightly (rustdoc JSON format_version 57)
        if: github.event.action != 'closed'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-17

      - name: Cache cargo registry + Astro content
        if: github.event.action != 'closed'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            website/.astro
          key: website-cargo-astro-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml', 'website/docs.sources.toml') }}
          restore-keys: |
            website-cargo-astro-${{ runner.os }}-

      # Content-addressed cache of EXECUTED notebooks (see
      # website/emitters/notebooks/src/.../pipeline.py). The key mirrors the
      # per-notebook fingerprint: the jupytext sources + the emitter's own
      # source + both lockfiles. A full match reuses every tutorial with NO
      # kernel execution; the restore-keys fallback gives a partial hit so only
      # the notebooks whose fingerprint changed re-execute. `v2` tracks
      # CACHE_SCHEMA_VERSION.
      - name: Restore notebook execution cache
        if: github.event.action != 'closed'
        uses: actions/cache@v5
        with:
          path: website/emitters/notebooks/.notebook-cache
          key: notebooks-v2-${{ runner.os }}-${{ hashFiles('docs/digital/**/*.py', 'website/emitters/notebooks/src/**/*.py', 'website/emitters/notebooks/uv.lock', 'uv.lock') }}
          restore-keys: |
            notebooks-v2-${{ runner.os }}-

      # Generates src/content/docs/api/dev/** (python + rust) + inventories +
      # versions.json. `uv run` here uses the repo env synced above so
      # resolve_sources.py can `uv pip show bloqade-*` to pin each source tag.
      - name: Generate dev API content
        if: github.event.action != 'closed'
        run: >
          uv run python website/scripts/build_versions.py
          --versions dev
          --clone-dir website/sources
          --rust-toolchain nightly-2026-04-17

      # Cache-first (re)generation of guides/tutorials/** from docs/digital/**.
      # EXECUTE_NOTEBOOKS=1 => run + cache executable tutorials (a warm cache =>
      # zero kernels; a changed notebook => only it re-executes); tsim/gemini
      # opt out (static) per the driver manifest, and anything that fails to
      # execute degrades to a static render (never fails the build). Runs before
      # the Astro build so every tutorial page + its assets exist.
      - name: Generate tutorials (cache-first)
        if: github.event.action != 'closed'
        env:
          EXECUTE_NOTEBOOKS: "1"
        run: uv run --project website/emitters/notebooks bloqade-docs-build-notebooks

      # Auto-runs build_inventory.mjs (config:setup), Pagefind, and the xref
      # integration that emits dist/objects.inv. XREF_STRICT=0 -> warn (don't
      # fail the preview) on unresolved cross-references.
      - name: Build Astro site
        if: github.event.action != 'closed'
        env:
          XREF_STRICT: "0"
        run: pnpm --dir website build

      # ---- deploy / teardown. Runs on `closed` too: pr-preview-action's
      #      `auto` mode removes `astro-preview/pr-<N>/` when the PR closes. ----
      - name: Deploy PR preview to gh-pages:/astro-preview/pr-<N>/
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: website/dist
          umbrella-dir: astro-preview
          pages-base-url: https://bloqade.quera.com

      # Gate the PR on link + cross-reference reachability. Purely ADDITIVE:
      # runs AFTER the deploy above (which stays warn-only) so the preview is
      # always published for inspection, and only this step's pass/fail gates the
      # PR. Isolated STRICT rebuild into `dist-check` (leaves `website/dist`
      # untouched):
      #   * XREF_STRICT=1   -> the xref integration FAILS on any unresolved <ApiXref>
      #   * check_links.mjs -> FAILS on any unreachable internal link / fragment
      #     anchor (SITE_BASE from the job env keeps base-prefixing consistent).
      #   * check_xrefs.mjs -> FAILS if either emitter stops PRODUCING docstring
      #     <ApiXref> (per-language floors) or any docstring anchor is
      #     unresolved. Reuses the SAME dist-check build (no redundant build).
      # Mirrors `mise run docs:check`. Skipped on PR-close (teardown-only).
      - name: Check internal links + API xrefs
        if: github.event.action != 'closed'
        env:
          XREF_STRICT: "1"
        run: |
          pnpm --dir website exec astro build --outDir dist-check
          node website/scripts/check_links.mjs website/dist-check
          node website/scripts/check_xrefs.mjs website/dist-check

      # ---- docs:test — build-warning gate + per-page RUNTIME error crawl.
      # SEPARATE from the link/xref gate above (does NOT replace it). Mirrors
      # `mise run docs:test`, but the tutorials were already generated above, so
      # it just runs the two harness scripts directly. Skipped on PR-close
      # (teardown-only), like every other build step here. ----
      - name: Cache Playwright browsers
        if: github.event.action != 'closed'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pnpm lockfile, which pins the exact playwright version
          # (the browser build revision is tied to that version).
          key: playwright-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        if: github.event.action != 'closed'
        run: pnpm --dir website exec playwright install --with-deps chromium

      - name: Docs build-warning gate + runtime crawl (docs:test)
        if: github.event.action != 'closed'
        # check_build.mjs rebuilds website/dist (mirroring docs:build) and FAILS
        # on any non-allowlisted build warning/error; crawl_runtime.mjs then
        # serves that dist/ and loads every built page in headless Chromium,
        # failing on any per-page runtime error.
        run: |
          node website/scripts/check_build.mjs
          node website/scripts/crawl_runtime.mjs website/dist
