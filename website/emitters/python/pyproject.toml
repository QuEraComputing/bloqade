[project]
name = "bloqade-docs-emit-python"
version = "0.1.0"
description = "Emit Bloqade Python API reference as Starlight-compatible MDX using griffe."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "griffe>=1.5,<2",
]

[project.scripts]
bloqade-docs-emit-python = "bloqade_docs_emit_python.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloqade_docs_emit_python"]
