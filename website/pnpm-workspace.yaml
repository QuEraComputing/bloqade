# pnpm settings for the docs site. pnpm 11 no longer reads the package.json
# "pnpm" field, so build-script policy lives here.
#
# pnpm blocks dependency build scripts by default and, in CI (e.g. AWS Amplify),
# treats an unapproved build script as a HARD failure (ERR_PNPM_IGNORED_BUILDS,
# exit 1). Only esbuild (JS bundling) and sharp (image optimization) ship build
# scripts in this lockfile, and both are REQUIRED by `astro build`.
#
# The precise `onlyBuiltDependencies: [esbuild, sharp]` allowlist is READ by
# pnpm (`pnpm config get` shows it) but is NOT applied from a settings-only
# pnpm-workspace.yaml in pnpm 11.x — the builds are still reported ignored and
# the CI install fails. `dangerouslyAllowAllBuilds` DOES take effect, and since
# esbuild + sharp are the only packages with build scripts here it is equivalent
# in scope (re-check the ERR_PNPM_IGNORED_BUILDS list if deps change).
dangerouslyAllowAllBuilds: true
